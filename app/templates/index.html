{% extends "base.html" %}

{% block body %}
  <main>
    <div class="row">
      <div id="drop" class="uploader" data-id="app-config" data-max-file-mb="{{ max_file_mb }}">
        <p>Drag &amp; Drop files here or <label for="file" class="btn">Select File</label></p>
        <p class="muted">Images: JPG/PNG/GIF/WEBP · Files: ZIP/TAR/RAR/7Z · max. {{ max_file_mb }} MB</p>
        <input id="file" type="file" />
        <progress id="prog" value="0" max="100" style="display:none"></progress>
      </div>
    </div>
    <div class="tabs">
      <button id="tab-img" class="tab active">Images</button>
      <button id="tab-files" class="tab">Files</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="pager">
      <button id="prev" class="btn">Prev</button>
      <button id="next" class="btn">Next</button>
      <span id="pager-info" class="info"></span>
    </div>
  </main>
{% endblock %}

{% block scripts %}
  <span id="app-config" data-max-file-mb="{{ max_file_mb }}" hidden></span>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
{% endblock %}
