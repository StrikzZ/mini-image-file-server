<header>
  <div class="head-left"><h1>{{ title }}</h1></div>
  <div class="head-left">
    <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" title="Toggle dark mode" aria-label="Toggle dark mode">
      <span class="track">
        <span class="icon sun" aria-hidden="true">☀️</span>
        <span class="icon moon" aria-hidden="true">🌙</span>
        <span class="thumb"></span>
      </span>
    </button>
    <img class="logo" src="{{ url_for('static', path='img/logo.png') }}" alt="Mini logo" />
  </div>
</header>
